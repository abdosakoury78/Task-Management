
<div class="tasks-container">

    <nav class="tasks-navbar" aria-label="Filter tasks by status">

        <button
        type="button"
        class="status"
        [class.active]="filterStatus === 'all'"
        [attr.aria-pressed]="filterStatus === 'all'"
        (click)="changeStatus('all')"
        >
            <span class="status-label">All Tasks</span>
            <span class="status-count">{{tasks.length}}</span>
        </button>

        <button
        type="button"
        class="status"
        [class.active]="filterStatus === 'todo'"
        [attr.aria-pressed]="filterStatus === 'todo'"
        (click)="changeStatus('todo')"
        >
            <span class="status-label">To Do</span>
            <span class="status-count">{{todoTasks.length}}</span>
        </button>

        <button
        type="button"
        class="status"
        [class.active]="filterStatus === 'in-progress'"
        [attr.aria-pressed]="filterStatus === 'in-progress'"
        (click)="changeStatus('in-progress')"
        >
            <span class="status-label">In Progress</span>
            <span class="status-count">{{inProgressTasks.length}}</span>
        </button>

        <button
        type="button"
        class="status"
        [class.active]="filterStatus === 'done'"
        [attr.aria-pressed]="filterStatus === 'done'"
        (click)="changeStatus('done')"
        >
            <span class="status-label">Done</span>
            <span class="status-count">{{doneTasks.length}}</span>
        </button>

    </nav>

    <app-tasks-body [selectedStatus]="filterStatus"></app-tasks-body>

</div>
