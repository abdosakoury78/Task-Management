
<div class="notification-container">
  <div class="notifications">

    <!-- Header -->
    <header class="notification-header">
      <div class="notification-number">
        <h2>Notifications</h2>
        <span>1</span>
      </div>

      <button type="button" class="mark-all-read">
        Mark All Read
      </button>
    </header>

    <!-- Notifications List -->
    <div class="notifications-body">

      <!-- Unread Notification -->
      <article class="notification unread">
        <div class="notification-info">

          <div class="avatar" aria-hidden="true">
            <span>AH</span>
          </div>

          <div class="notification-content">
            <p class="notification-description">
              Ahmed assigned you to
              <strong>Build shopping cart</strong>
            </p>

            <time class="notification-time" datetime="2026-08-22">
              Aug 22
            </time>
          </div>

        </div>

        <span
          class="notification-mark"
          role="img"
          aria-label="Unread notification">
        </span>
      </article>

      <!-- Read Notification -->
      <article class="notification">
        <div class="notification-info">

          <div class="avatar" aria-hidden="true">
            <span>AH</span>
          </div>

          <div class="notification-content">
            <p class="notification-description">
              Ahmed assigned you to
              <strong>Build shopping cart</strong>
            </p>

            <time class="notification-time" datetime="2026-08-22">
              Aug 22
            </time>
          </div>

        </div>
      </article>

    </div>
  </div>
</div>
